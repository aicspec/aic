<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 838" width="960" height="838" role="img" aria-labelledby="t d">
<title id="t">The online shop example</title>
<desc id="d">Customer app calls Orders API on Order Service. Order Service calls Catalog API and the Payment provider, reads and writes Orders, and publishes to order-placed, which activates Notification Worker. The worker calls the Email provider.</desc>
